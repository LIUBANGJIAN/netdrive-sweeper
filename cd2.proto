syntax = "proto3";

package clouddrive;

option go_package = "netdrive-sweeper/internal/cd2pb;cd2pb";

import "google/protobuf/empty.proto";
import "google/protobuf/timestamp.proto";

service CloudDriveFileSrv {
  rpc GetSystemInfo(google.protobuf.Empty) returns (CloudDriveSystemInfo) {}
  rpc GetApiTokenInfo(StringValue) returns (TokenInfo) {}
  rpc GetSubFiles(ListSubFileRequest) returns (stream SubFilesReply) {}
  rpc DeleteFile(FileRequest) returns (FileOperationResult) {}
  rpc DeleteFilePermanently(FileRequest) returns (FileOperationResult) {}
  rpc ListOfflineFilesByPath(FileRequest) returns (OfflineFileListResult) {}
  rpc ListAllOfflineFiles(OfflineFileListAllRequest) returns (OfflineFileListAllResult) {}
  // PushMessage 是 CD2 服务器推送流（事件驱动实时感知的唯一合法来源）。
  rpc PushMessage(google.protobuf.Empty) returns (stream CloudDrivePushMessage) {}
  // GetAllCloudApis 返回所有云盘 API 连接（含云端事件监听器是否运行）。
  // 用于诊断「事件驱动忽然失效」：isCloudEventListenerRunning 表示 CD2 的云盘「云端原生事件
  // 监听器」是否运行；为 false 并不必然意味着 PushMessage 停止投递（CD2 仍可能通过自身变更
  // 检测投递，实证：该标记为 false 时程序仍持续收到 changeType=1/2 事件）。对齐指南 3721-3747。
  rpc GetAllCloudApis(google.protobuf.Empty) returns (CloudAPIList) {}
  // GetRuntimeInfo 返回服务器运行时信息（含版本），仅用于诊断「事件驱动失效」时判断
  // CD2 版本是否过旧（官方指南 4798-4813，字段号对齐：productName=1/productVersion=2）。
  rpc GetRuntimeInfo(google.protobuf.Empty) returns (RuntimeInfo) {}
  // GetServiceCapabilities 查询服务是否支持重启/更新（指南 7536-7550），
  // 用于诊断「云端事件监听器未运行」时判断能否用 RestartService 远程重启 CD2 恢复监听器。
  rpc GetServiceCapabilities(google.protobuf.Empty) returns (ServiceCapabilities) {}
}

enum OfflineStatus {
  OfflineUnknown = 0;
  OfflineFinished = 1;
  OfflineError = 2;
  OfflineDownloading = 3;
}

message OfflineFile {
}

message OfflineFileListResult {
  repeated OfflineFile offlineFiles = 1;
  OfflineStatus status = 2;
}

message OfflineFileListAllRequest {
  string cloudName = 1;
  string cloudAccountId = 2;
  uint32 page = 3;
  optional string path = 4;
}

message OfflineFileListAllResult {
  repeated OfflineFile offlineFiles = 1;
}

message StringValue {
  string value = 1;
}

message CloudDriveSystemInfo {
  bool systemReady = 1;
  string userName = 2;
  string version = 3;
}

// CloudDrivePushMessage 仅解码 messageType（字段1，FILE_SYSTEM_CHANGE=4）。
// oneof data（字段2-8）暂不解码：官方 FileSystemChange 的字段号未在指南中给出，
// 为避免猜错字段号，只依赖 messageType 触发防抖重扫。proto.Unmarshal 对未知字段
// 不会报错（落入 unknown fields），因此只声明字段1 是安全的。
message CloudDrivePushMessage {
  int32 messageType = 1;
}

message ListSubFileRequest {
  string path = 1;
  bool forceRefresh = 2;
  optional bool checkExpires = 3;
}

message SubFilesReply {
  repeated CloudDriveFile subFiles = 1;
}

message FileRequest {
  string path = 1;
  optional bool forceRefresh = 2;
}

message FileOperationResult {
  bool success = 1;
  string errorMessage = 2;
  repeated string resultFilePaths = 3;
}

message CloudDriveFile {
  string id = 1;
  string name = 2;
  string fullPathName = 3;
  int64 size = 4;
  enum FileType {
    Directory = 0;
    File = 1;
    Other = 2;
  }
  FileType fileType = 5;
  google.protobuf.Timestamp createTime = 6;
  google.protobuf.Timestamp writeTime = 7;
  google.protobuf.Timestamp accessTime = 8;
  bool isDirectory = 30;
  bool isRoot = 31;
  bool isCloudRoot = 32;
  bool isCloudDirectory = 33;
  bool isCloudFile = 34;
  bool isForbidden = 36;
  bool canDeletePermanently = 69;
  bool readOnly = 80;
}

message TokenPermissions {
  bool allow_list = 1;
  bool allow_search = 2;
  bool allow_create_folder = 4;
  bool allow_create_file = 5;
  bool allow_write = 6;
  bool allow_read = 7;
  bool allow_rename = 8;
  bool allow_move = 9;
  bool allow_copy = 10;
  bool allow_delete = 11;
  bool allow_delete_permanently = 12;
  bool allow_push_message = 41;  // 0.9.15 新增：PushMessage/PushTaskChange 订阅权限
}

message TokenInfo {
  string token = 1;
  string rootDir = 2;
  TokenPermissions permissions = 3;
  optional uint64 expires_in = 4;
  string friendly_name = 5;
  bool enableGrpcLog = 6;
  bool enableStreamFileLog = 7;
}

// CloudAPIList / CloudAPI 对齐官方 GetAllCloudApis 响应（指南 3728-3747）。
// isCloudEventListenerRunning 表示该云盘「云端原生事件监听器」是否运行；为 false 不必然意味着
// PushMessage 停止投递（CD2 仍可能通过自身变更检测投递事件），仅作为诊断参考信号。
message CloudAPIList {
  repeated CloudAPI apis = 1;
}

message CloudAPI {
  string name = 1;
  string userName = 2;
  string nickName = 3;
  bool isLocked = 4;
  bool supportMultiThreadUploading = 5;
  bool supportQpsLimit = 6;
  bool isCloudEventListenerRunning = 7;
  bool hasPromotions = 8;
  optional string promotionTitle = 9;
  optional string path = 10;
  bool supportHttpDownload = 11;
  bool readOnly = 12;
}

// RuntimeInfo 对齐官方 GetRuntimeInfo 响应（指南 4806-4811）。
message RuntimeInfo {
  string productName = 1;
  string productVersion = 2;
  string cloudAPIVersion = 3;
  string osInfo = 4;
}

// ServiceCapabilities 对齐官方 GetServiceCapabilities 响应（指南 7544-7547）。
message ServiceCapabilities {
  bool canRestart = 1;
  bool canUpdate = 2;
}
